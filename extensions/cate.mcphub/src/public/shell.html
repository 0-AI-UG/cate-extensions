<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCPHub</title>
  <link rel="stylesheet" href="/__mcphub/style.css" />
</head>
<body>
  <!-- Loader / status overlay, shown until MCPHub is ready, and on error. -->
  <div id="overlay" class="overlay">
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Starting MCPHub…</h1>
      <p id="detail" class="detail">Resolving a MCPHub install on this machine.</p>
      <pre id="logs" class="logs" hidden></pre>
      <button id="retry" class="retry" hidden>Retry</button>
    </div>
  </div>

  <!-- The embedded MCPHub dashboard, reverse-proxied through this wrapper. -->
  <iframe id="frame" class="frame" hidden title="MCPHub dashboard"></iframe>

  <script src="/__mcphub/app.js"></script>
</body>
</html>
