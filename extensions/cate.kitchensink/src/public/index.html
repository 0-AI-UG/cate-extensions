<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Sink</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Kitchen Sink</h1>

  <section>
    <div class="row"><span class="label">cate.version</span><code id="version">...</code></div>
    <div class="row"><span class="label">panel.id</span><code id="panel">...</code></div>
    <div class="row"><span class="label">workspace</span><code id="workspace">...</code></div>
    <div class="row"><span class="label">theme</span><code id="theme">...</code></div>
  </section>

  <section>
    <h2>storage</h2>
    <textarea id="notes" rows="4" placeholder="Notes, autosaved to cate.storage"></textarea>
    <div class="row"><span class="label">status</span><code id="notes-status"></code></div>
    <div class="row">
      <button id="storage-keys">keys</button>
      <button id="storage-delete-notes">delete notes</button>
      <button id="panel-bump">panel counter +1</button>
    </div>
    <div class="row"><span class="label">keys</span><code id="keys-out"></code></div>
    <div class="row"><span class="label">panel counter</span><code id="panel-counter">0</code></div>
    <div class="row"><span class="label">onChange</span><code id="change-count">0</code></div>
  </section>

  <section>
    <h2>actions</h2>
    <div class="row">
      <button id="open-file">open package.json</button>
      <button id="open-file-line">open at line 2</button>
      <button id="spawn-panel">spawn panel</button>
      <button id="set-title">set title</button>
      <button id="notify">notify</button>
    </div>
  </section>

  <section>
    <h2>http</h2>
    <div class="row">
      <button id="call-info">GET /api/info</button>
      <button id="call-echo">POST /api/echo</button>
    </div>
    <pre id="http-out"></pre>
  </section>

  <section>
    <h2>websocket</h2>
    <div class="row">
      <input id="ws-input" type="text" value="hello" />
      <button id="ws-send">send</button>
    </div>
    <pre id="ws-out">connecting</pre>
  </section>

  <section>
    <h2>server to cate (CATE_API)</h2>
    <div class="row"><button id="roundtrip">run round-trip</button></div>
    <pre id="roundtrip-out"></pre>
  </section>

  <section>
    <h2>agent</h2>
    <div class="row">
      <input id="agent-input" type="text" value="Summarize this project's README in one sentence." />
      <button id="agent-run">send</button>
      <button id="agent-end">end</button>
    </div>
    <pre id="agent-out"></pre>
  </section>

  <pre id="log"></pre>
  <script src="app.js"></script>
</body>
</html>
