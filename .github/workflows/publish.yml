name: Publish catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Discover the extensions so the build matrix self-updates as new ones land.
  discover:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: List extensions
        run: |
          ids=$(ls -d extensions/*/ | xargs -n1 basename | jq -R . | jq -cs .)
          echo "extensions=$ids" >> "$GITHUB_OUTPUT"

  # Build each extension on its own so a failure points at the exact extension.
  build-extension:
    needs: discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover.outputs.extensions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build ${{ matrix.extension }}
        working-directory: extensions/${{ matrix.extension }}
        run: |
          # Every extension must have a valid manifest.json.
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          # TypeScript extensions (those with a package.json) compile; tsc emit
          # also typechecks. Asset-only extensions have nothing to build.
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm run build
          else
            echo "$PWD is asset-only, nothing to build"
          fi

  # Validate the catalog packages + index assemble from all extensions together.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build catalog
        run: ./build.sh

  # Build + publish to GitHub Pages on push to main (or manual dispatch).
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build catalog
        run: ./build.sh
        env:
          CATALOG_BASE_URL: https://0-ai-ug.github.io/cate-extensions
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
