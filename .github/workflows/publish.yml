name: Publish catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Discover the extensions so the build matrix self-updates as new ones land.
  discover:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: List extensions
        run: |
          ids=$(ls -d extensions/*/ | xargs -n1 basename | jq -R . | jq -cs .)
          echo "extensions=$ids" >> "$GITHUB_OUTPUT"

  # Build each extension on its own so a failure points at the exact extension.
  build-extension:
    needs: discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover.outputs.extensions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build ${{ matrix.extension }}
        working-directory: extensions/${{ matrix.extension }}
        run: |
          # Every extension must have a valid manifest.json.
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          # TypeScript extensions (those with a package.json) compile; tsc emit
          # also typechecks. Asset-only extensions have nothing to build.
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm run build
          else
            echo "$PWD is asset-only, nothing to build"
          fi

  # Validate the catalog packages + index assemble from all extensions together.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build catalog
        run: ./build.sh

  # Build + publish the catalog on push to main (or manual dispatch). The
  # catalog (index.json) and its artifact tarballs are hosted as assets on one
  # rolling GitHub Release tagged `catalog`, served over GitHub's CDN — no
  # GitHub Pages, and nothing committed back to the repo. Cate fetches
  # https://github.com/0-AI-UG/cate-extensions/releases/download/catalog/index.json
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # manage the `catalog` release + its assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build catalog
        run: ./build.sh
        env:
          # Release assets live in a flat namespace, so gen-catalog emits
          # artifactUrls of the form <base>/<id>-<version>.tgz (no /artifacts/).
          CATALOG_BASE_URL: https://github.com/${{ github.repository }}/releases/download/catalog
      - name: Publish catalog to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure the rolling `catalog` release exists (idempotent).
          gh release view catalog >/dev/null 2>&1 || \
            gh release create catalog \
              --title "Extension catalog" \
              --notes "Rolling release hosting the Cate extension catalog: index.json plus each extension's artifact tarball. Updated automatically on every push to main." \
              --latest=false
          # Upload the freshly built index + all artifacts, replacing prior
          # assets of the same name. Stale tarballs from retired extensions are
          # left in place (harmless — index.json never references them).
          gh release upload catalog \
            dist/catalog/index.json \
            dist/artifacts/*.tgz \
            --clobber
